
# Docs: https://github.com/Azure/functions-action
# More info: https://learn.microsoft.com/ja-jp/azure/azure-functions/functions-how-to-github-actions
name: Build and deploy Python project to Azure Function App - test-splunk-firewall-forwarder

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'   # repository root
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create and start virtual environment
        shell: bash
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements.txt

      # Optional: run tests
      # - name: Run unit tests
      #   run: pytest

      - name: Zip artifact for deployment
        shell: bash
        run: |
          zip -r release.zip ./*

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # （Zipのまま渡すパターンのほうが構文事故が減るので推奨）
      # - name: Unzip artifact for deployment
      #   run: |
      #     unzip release.zip
      #     rm release.zip

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A313D1B2640C4F3984FF834E058604E3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_87B5ACAE9D1246CFBD14D58AFE092DD9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_01EA6B9C995F41F18F9B04D75AC8D1A3 }}

      - name: Deploy to Azure Functions (Flex)
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'test-splunk-firewall-forwarder'
          slot-name: 'Production'
          # Zip をそのまま渡します
          package: 'release.zip'
          sku: 'flexconsumption'
          remote-build: 'true'
